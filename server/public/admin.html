<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravan Command</title>
<style>
  :root { --bg:#0d0a08; --card:#171210; --line:#2b221d; --text:#f3ece6; --muted:#9b8d83; --ember:#f97316; --green:#4ade80; --red:#f87171; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; } h1 span { color:var(--ember); }
  .tabs { display:flex; gap:8px; margin:18px 0; flex-wrap:wrap; }
  .tabs button { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:8px 18px; cursor:pointer; font-weight:600; }
  .tabs button.on { color:var(--text); border-color:var(--ember); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card b { font-size:26px; display:block; } .card span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-weight:600; }
  tr.click { cursor:pointer; } tr.click:hover { background:#1d1613; }
  .pill { padding:2px 10px; border-radius:999px; font-size:11px; font-weight:700; }
  .ok { background:#12291a; color:var(--green); } .bad { background:#2b1414; color:var(--red); } .mid { background:#241d12; color:var(--ember); }
  .split { display:grid; grid-template-columns:320px 1fr; gap:14px; min-height:420px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:auto; max-height:70vh; }
  .conv { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .conv:hover,.conv.on { background:#1d1613; }
  .conv b { display:block; } .conv small { color:var(--muted); }
  .badge { float:right; background:var(--ember); color:#000; border-radius:999px; padding:0 8px; font-size:11px; font-weight:800; }
  .thread { background:var(--card); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; max-height:70vh; }
  .msgs { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:70%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
  .in { background:#221a15; align-self:flex-start; } .out { background:#332211; align-self:flex-end; }
  .m small { display:block; color:var(--muted); font-size:10px; margin-top:4px; }
  .send { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input,textarea,select { background:#0f0c0a; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 12px; font:inherit; width:100%; }
  .send input { flex:1; }
  button.go { background:var(--ember); border:0; color:#000; font-weight:800; border-radius:10px; padding:10px 18px; cursor:pointer; }
  dialog { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:16px; max-width:720px; width:92%; padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  .turn { margin-bottom:8px; } .turn b { color:var(--ember); }
  #login { max-width:340px; margin:16vh auto; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; margin:10px 0; } .muted { color:var(--muted); }
  label { font-size:12px; color:var(--muted); display:block; margin:10px 0 4px; }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Ravan <span>Command</span></h1>
  <input id="pw" type="password" placeholder="Dashboard password">
  <button class="go" onclick="login()">Enter</button>
  <p id="loginerr" class="muted"></p>
</div>

<div class="wrap" id="app" hidden>
  <h1>Ravan <span>Command</span> <small class="muted" style="font-weight:400;font-size:12px">— calls · WhatsApp · leads</small></h1>
  <div class="tabs">
    <button data-t="overview" class="on">Overview</button>
    <button data-t="calls">Calls</button>
    <button data-t="inbox">WhatsApp Inbox</button>
    <button data-t="offers">Offers</button>
    <button data-t="playbook">Playbook</button>
  </div>

  <div id="t-overview">
    <div class="cards" id="stats"></div>
    <div class="row">
      <input id="dialNum" placeholder="Dial a number now (10 digits)" style="max-width:280px">
      <button class="go" onclick="dial()">Call via AI</button>
      <span id="dialmsg" class="muted"></span>
    </div>
  </div>

  <div id="t-calls" hidden>
    <table><thead><tr><th>When</th><th>Number</th><th>Name</th><th>Status</th><th>Duration</th><th></th></tr></thead><tbody id="callrows"></tbody></table>
  </div>

  <div id="t-inbox" hidden>
    <div class="split">
      <div class="list" id="convs"></div>
      <div class="thread">
        <div class="msgs" id="msgs"><p class="muted" style="margin:auto">Select a conversation</p></div>
        <div class="send">
          <input id="reply" placeholder="Reply (needs open 24h window)…" onkeydown="if(event.key==='Enter')sendReply()">
          <button class="go" onclick="sendReply()">Send</button>
          <button class="go" style="background:#332211;color:var(--text)" onclick="sendTpl()" title="Send template (opens closed conversations)">Tpl</button>
        </div>
      </div>
    </div>
  </div>

  <div id="t-playbook" hidden>
    <div class="card" style="max-width:760px">
      <p class="muted" style="margin:0 0 10px">
        The agent quotes these rules word for word and will not state a price or policy that is not here.
        Saving re-embeds the rule automatically.
      </p>
      <label>Title</label><input id="pbtitle" placeholder="e.g. Website pricing">
      <label>Rule — write it as you want it quoted to a customer</label><textarea id="pbrule" rows="4"></textarea>
      <label>Category</label><input id="pbcat" placeholder="pricing / delivery / policy / general" value="general">
      <div class="row"><label style="margin:0"><input type="checkbox" id="pbactive" style="width:auto" checked> active</label>
      <button class="go" onclick="savePolicy()">Save rule</button>
      <button class="go" style="background:#332211;color:var(--text)" onclick="clearPolicy()">New</button>
      <span id="pbmsg" class="muted"></span></div>
    </div>
    <div class="card" style="max-width:760px">
      <label>Test retrieval — ask the way a customer would, in any language</label>
      <div class="row"><input id="pbq" placeholder="kitna paisa lagega website ka">
      <button class="go" onclick="testPolicy()">Search</button></div>
      <div id="pbresults" class="muted"></div>
    </div>
    <table><thead><tr><th>Title</th><th>Category</th><th>Embedded</th><th></th></tr></thead><tbody id="pbrows"></tbody></table>
  </div>

  <div id="t-offers" hidden>
    <div class="card" style="max-width:640px">
      <label>Offer name</label><input id="oname">
      <label>Pitch — what the agent should discuss/offer</label><textarea id="opitch" rows="5"></textarea>
      <label>Goal of the call</label><input id="ogoal" placeholder="e.g. book a strategy meeting">
      <div class="row"><label style="margin:0"><input type="checkbox" id="oactive" style="width:auto"> active</label>
      <button class="go" onclick="saveOffer()">Save offer</button><span id="omsg" class="muted"></span></div>
    </div>
    <table><thead><tr><th>Name</th><th>Goal</th><th>Active</th></tr></thead><tbody id="offerrows"></tbody></table>
  </div>
</div>

<dialog id="dlg"><div id="dlgbody"></div><div class="row" style="justify-content:flex-end"><button class="go" onclick="dlg.close()">Close</button></div></dialog>

<script>
let TOKEN = localStorage.getItem("mr_token") || "";
let currentPhone = null, currentOfferId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN, ...(opts.headers||{}) } });
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
function showLogin() { $("app").hidden = true; $("login").hidden = false; }
async function login() {
  TOKEN = $("pw").value.trim();
  try { await api("/api/admin/overview"); localStorage.setItem("mr_token", TOKEN); $("login").hidden = true; $("app").hidden = false; refresh(); }
  catch { $("loginerr").textContent = "Wrong password."; }
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on")); b.classList.add("on");
  ["overview","calls","inbox","offers","playbook"].forEach(t => $("t-"+t).hidden = t !== b.dataset.t);
  refresh();
});
const activeTab = () => document.querySelector(".tabs button.on").dataset.t;

async function refresh() {
  const t = activeTab();
  if (t === "playbook") {
    const rows = await api("/api/admin/playbook");
    $("pbrows").innerHTML = rows.map(p =>
      "<tr><td>" + esc(p.title) + "<br><span class=muted>" + esc(p.rule.slice(0, 90)) + (p.rule.length > 90 ? "…" : "") + "</span></td>" +
      "<td>" + esc(p.category) + "</td>" +
      "<td>" + (p.embedded ? "yes" : "<b>no</b>") + (p.active ? "" : " · inactive") + "</td>" +
      "<td><button class=go onclick='editPolicy(" + esc(JSON.stringify(p)).replace(/'/g, "&#39;") + ")'>Edit</button> " +
      "<button class=go style=\"background:#3a1f1f\" onclick=\"deletePolicy('" + p.id + "'," + JSON.stringify(p.title) + ")\">Delete</button></td></tr>").join("");
    return;
  }
  if (t === "overview") {
    const s = await api("/api/admin/overview");
    $("stats").innerHTML = Object.entries({Leads:s.leads, "Calls total":s.calls, Connected:s.connected, "Calls today":s.calls_today, Chats:s.conversations, Unread:s.unread})
      .map(([k,v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join("");
  }
  if (t === "calls") {
    const rows = await api("/api/admin/calls");
    $("callrows").innerHTML = rows.map(c => `<tr class="click" onclick="openCall(${c.id})">
      <td>${esc((c.created_at||"").slice(0,16))}</td><td>${esc(c.phone10)}</td><td>${esc(c.name||"—")}</td>
      <td><span class="pill ${c.status==='connected'?'ok':c.status==='dispatched'?'mid':'bad'}">${esc(c.status)}</span></td>
      <td>${c.duration ? Math.round(c.duration)+"s" : "—"}</td><td>${c.has_transcript ? "📄" : ""}</td></tr>`).join("");
  }
  if (t === "inbox") {
    const convs = await api("/api/admin/conversations");
    $("convs").innerHTML = convs.map(c => `<div class="conv ${c.phone10===currentPhone?'on':''}" onclick="openConv('${c.phone10}')">
      ${c.unread ? `<span class="badge">${c.unread}</span>` : ""}
      <b>${esc(c.contact_name || c.phone10)}</b><small>${esc((c.last_message_text||"").slice(0,42))}</small></div>`).join("") || `<p class="muted" style="padding:14px">No conversations yet</p>`;
    if (currentPhone) loadThread();
  }
  if (t === "offers") {
    const offers = await api("/api/admin/offers");
    $("offerrows").innerHTML = offers.map(o => `<tr class="click" onclick='editOffer(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
      <td>${esc(o.name)}</td><td>${esc(o.goal||"—")}</td><td>${o.active ? "🔥" : ""}</td></tr>`).join("");
  }
}

async function openCall(id) {
  const c = await api("/api/admin/calls/" + id);
  const t = (c.transcript||[]).map(x => `<p class="turn"><b>${esc((x.role||x.speaker||"?").toUpperCase())}:</b> ${esc(x.text||x.content||JSON.stringify(x))}</p>`).join("") || "<p class='muted'>No transcript.</p>";
  $("dlgbody").innerHTML = `<h3>${esc(c.phone10)} — ${esc(c.status)} ${c.duration?("· "+Math.round(c.duration)+"s"):""}</h3>
    ${c.variables ? `<p class="muted">Extracted: ${esc(JSON.stringify(c.variables))}</p>` : ""}
    ${c.failure_reason ? `<p class="muted">Failure: ${esc(c.failure_reason)}</p>` : ""}<hr style="border-color:var(--line);margin:10px 0">${t}`;
  dlg.showModal();
}

async function openConv(p) { currentPhone = p; refresh(); }
async function loadThread() {
  const msgs = await api("/api/admin/messages?phone=" + currentPhone);
  $("msgs").innerHTML = msgs.map(m => `<div class="m ${m.direction==='in'?'in':'out'}">${esc(m.text || m.caption || "["+m.type+"]")}
    <small>${esc((m.timestamp||"").slice(0,16).replace("T"," "))}${m.direction==='out' ? " · " + esc(m.status||"") + (m.source ? " · "+esc(m.source) : "") : ""}</small></div>`).join("");
  $("msgs").scrollTop = $("msgs").scrollHeight;
}
async function sendReply() {
  const text = $("reply").value.trim();
  if (!text || !currentPhone) return;
  try { await api("/api/admin/send", { method:"POST", body: JSON.stringify({ phone: currentPhone, text }) }); $("reply").value = ""; loadThread(); }
  catch (e) { alert(e.message); }
}
async function sendTpl() {
  if (!currentPhone) return;
  const name = prompt("Template name to send:", "hi_intro");
  if (!name) return;
  try { await api("/api/admin/send", { method:"POST", body: JSON.stringify({ phone: currentPhone, template: name }) }); loadThread(); }
  catch (e) { alert(e.message); }
}
async function dial() {
  try { const r = await api("/api/admin/call", { method:"POST", body: JSON.stringify({ phone: $("dialNum").value }) }); $("dialmsg").textContent = "Dispatched " + r.attempt_id.slice(0,8); }
  catch (e) { $("dialmsg").textContent = e.message; }
}
function editOffer(o) { currentOfferId = o.id; $("oname").value = o.name; $("opitch").value = o.pitch; $("ogoal").value = o.goal||""; $("oactive").checked = !!o.active; }
async function saveOffer() {
  try {
    await api("/api/admin/offers", { method:"POST", body: JSON.stringify({ id: currentOfferId, name: $("oname").value, pitch: $("opitch").value, goal: $("ogoal").value, active: $("oactive").checked }) });
    $("omsg").textContent = "Saved."; currentOfferId = null; ["oname","opitch","ogoal"].forEach(i => $(i).value = ""); $("oactive").checked = false; refresh();
  } catch (e) { $("omsg").textContent = e.message; }
}


let currentPolicyId = null;
function clearPolicy() {
  currentPolicyId = null;
  $("pbtitle").value = ""; $("pbrule").value = ""; $("pbcat").value = "general";
  $("pbactive").checked = true; $("pbmsg").textContent = "";
}
function editPolicy(p) {
  currentPolicyId = p.id;
  $("pbtitle").value = p.title; $("pbrule").value = p.rule;
  $("pbcat").value = p.category; $("pbactive").checked = !!p.active;
  $("pbmsg").textContent = "Editing — Save overwrites this rule.";
  window.scrollTo(0, 0);
}
async function savePolicy() {
  $("pbmsg").textContent = "Embedding…";
  try {
    const r = await api("/api/admin/playbook", { method: "POST", body: JSON.stringify({
      id: currentPolicyId, title: $("pbtitle").value, rule: $("pbrule").value,
      category: $("pbcat").value, active: $("pbactive").checked }) });
    $("pbmsg").textContent = r.embedded ? "Saved and embedded." : "Saved — but NOT embedded (no Google key), so it is keyword-only.";
    currentPolicyId = null; clearPolicy(); refresh();
  } catch (e) { $("pbmsg").textContent = e.message; }
}
async function deletePolicy(id, title) {
  if (!confirm("Delete \"" + title + "\"? The agent will no longer be able to quote it.")) return;
  try { await api("/api/admin/playbook/" + id, { method: "DELETE" }); refresh(); }
  catch (e) { $("pbmsg").textContent = e.message; }
}
async function testPolicy() {
  $("pbresults").textContent = "Searching…";
  try {
    const r = await api("/api/admin/playbook/search", { method: "POST", body: JSON.stringify({ query: $("pbq").value }) });
    if (!r.results.length) { $("pbresults").innerHTML = "<p>No match — the agent would say it needs to check with the team.</p>"; return; }
    $("pbresults").innerHTML = "<p>via " + esc(r.mode) + " search:</p>" + r.results.map(x =>
      "<p><b>" + esc(x.title) + "</b>" + (x.similarity != null ? " <span class=muted>" + x.similarity.toFixed(3) + "</span>" : "") +
      "<br>" + esc(x.rule) + "</p>").join("");
  } catch (e) { $("pbresults").textContent = e.message; }
}

if (TOKEN) { $("app").hidden = false; refresh().catch(showLogin); } else showLogin();
setInterval(() => { if (!$("app").hidden && (activeTab() === "inbox" || activeTab() === "overview")) refresh(); }, 10000);
</script>
</body>
</html>
