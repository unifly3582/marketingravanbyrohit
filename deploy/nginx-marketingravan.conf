# Mirrors what is actually installed at /etc/nginx/sites-available/marketingravan
# on the VPS (checked 2026-09-05).
#
# Do NOT copy this file over the live one blind. The box hosts several other
# sites, and this file used to say `listen 80 default_server; server_name _;`,
# which had drifted from production — installing it would have taken the whole
# server's default vhost. Diff first, then patch the block you need.
#
# TLS is terminated by Cloudflare, not here; nginx only ever sees plain HTTP,
# which is why there is no ssl_certificate in this file. Cloudflare proxies
# WebSockets, so wss://marketingravan.com/api/voice/web reaches the blocks below.

server {
    listen 8100;
    listen [::]:8100;
    listen 80;
    listen [::]:80;
    server_name marketingravan.com www.marketingravan.com;

    root /var/www/marketingravan/site/dist;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard → node service
    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket paths → node service.
    #
    # These need their own blocks: without proxy_http_version 1.1 and the
    # Upgrade/Connection headers, nginx quietly downgrades the handshake to a
    # plain request and the socket never opens — no error anywhere, the browser
    # just sits on "Connecting". They are also long-lived and mostly idle
    # (nobody talks continuously for five minutes), so the default 60s read
    # timeout would cut conversations off mid-sentence.
    #
    # /api/voice/answer/:callId is a normal POST and deliberately stays on the
    # plain /api/ block below.

    # Website voice agent — browser microphone in, agent audio out.
    location = /api/voice/web {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Telephony media stream — Vobiz call audio.
    location /api/voice/stream/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Call-request API → node service
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|woff2|glb)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
