# Mirrors what should be installed at /etc/nginx/sites-available/marketingravan
# on the VPS.
#
# The box hosts several other sites (bugglyfarms, jarakitchen, uniflyinsect ...)
# on the same nginx, so this file must never claim `default_server` or
# `server_name _`. It only ever answers for marketingravan.com.
#
# TLS is terminated HERE, by nginx, with a Let's Encrypt certificate -- not by
# Cloudflare. History, 2026-09-05: the site used to sit behind Cloudflare's proxy
# ("Flexible" SSL, origin on plain HTTP). That was fine for pages and bad for the
# live microphone: Cloudflare served Indian visitors from Singapore, adding
# ~115 ms to every round trip and jitter on top, and the browser paid it several
# times per spoken turn. A separate unproxied hostname (voice.marketingravan.com)
# fixed the speed but introduced a second name that some home routers refused to
# resolve -- at which point the browser silently fell back to the slow route and
# the agent felt sluggish again. Serving the whole site straight from the
# Mumbai VPS removes both problems: one hostname, one path, ~30 ms round trip.
#
# Install (run on the VPS, see deploy/go-direct.sh):
#
#   certbot certonly --nginx -d marketingravan.com -d www.marketingravan.com
#   cp deploy/nginx-marketingravan.conf /etc/nginx/sites-available/marketingravan
#   nginx -t && systemctl reload nginx
#
# then in Cloudflare DNS turn the proxy OFF (grey cloud, "DNS only") on the
# A records for `marketingravan.com` and `www`. Both orders are safe: with the
# proxy still on, Cloudflare talks to :80 exactly as before and is not
# redirected (see the map below); with it off, browsers land on :443.

# Send plain-HTTP visitors to HTTPS -- but only visitors who really arrived over
# plain HTTP. While Cloudflare's proxy is still on it fetches from :80 with
# `X-Forwarded-Proto: https`; redirecting that would loop forever (the classic
# "Flexible SSL" redirect loop). Port 8100 is the bare-IP debugging listener
# and is left alone.
map "$server_port:$http_x_forwarded_proto" $mr_redirect_to_https {
    default     0;
    "80:"       1;
    "80:http"   1;
}

server {
    listen 8100;
    listen [::]:8100;
    listen 80;
    listen [::]:80;
    # nginx 1.24 (Ubuntu 24.04): `http2` goes on the listen line; the separate
    # `http2 on;` directive only exists from 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marketingravan.com www.marketingravan.com;

    ssl_certificate     /etc/letsencrypt/live/marketingravan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketingravan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($mr_redirect_to_https) {
        return 301 https://$host$request_uri;
    }

    root /var/www/marketingravan/site/dist;
    index index.html;

    # SPA routing
    location / {
        # HTML is what points at the hashed asset names, so it must never be
        # held by a browser cache: phones were showing a stale index.html for
        # hours after a deploy.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Dashboard -> node service
    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket paths -> node service.
    #
    # These need their own blocks: without proxy_http_version 1.1 and the
    # Upgrade/Connection headers, nginx quietly downgrades the handshake to a
    # plain request and the socket never opens -- no error anywhere, the browser
    # just sits on "Connecting". They are also long-lived and mostly idle
    # (nobody talks continuously for five minutes), so the default 60s read
    # timeout would cut conversations off mid-sentence.
    #
    # /api/voice/answer/:callId is a normal POST and deliberately stays on the
    # plain /api/ block below.

    # Website voice agent -- browser microphone in, agent audio out.
    location = /api/voice/web {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Audio frames are small and latency-sensitive; holding them to fill a
        # buffer is exactly the wrong trade.
        proxy_buffering off;
        tcp_nodelay on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Telephony media stream -- Vobiz call audio.
    location /api/voice/stream/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Call-request API -> node service
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching. Filenames carry a content hash and a build id
    # (site/vite.config.js), so "immutable" is honest.
    location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|woff2|glb|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
