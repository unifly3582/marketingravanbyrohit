# voice.marketingravan.com — the realtime audio socket, deliberately NOT behind
# Cloudflare.
#
# Why this file exists at all:
#
#   marketingravan.com is proxied by Cloudflare, which is right for the site and
#   wrong for a live microphone. Measured from an Indian connection on
#   2026-09-05, against this same Mumbai server:
#
#       straight to the box      52 ms round trip
#       through Cloudflare      167 ms round trip, spiking to 630 ms after a
#                               burst of audio
#
#   Cloudflare was serving that visitor from Singapore. A voice turn pays the
#   round trip several times over — microphone frames going up, the end-of-speech
#   decision, the reply coming back — so ~115 ms of detour becomes most of a
#   second of "why is this sluggish", and the jitter is heard as stuttering.
#   That is the entire gap between the dev server feeling instant and the live
#   site feeling slow: on localhost the round trip is 0 ms.
#
# To bring this up:
#
#   1. DNS: add an A record for `voice` -> 147.93.28.140 with the proxy OFF
#      (grey cloud, "DNS only" in Cloudflare). Orange cloud here defeats the
#      entire point of the file.
#   2. Install this file and enable it:
#        cp deploy/nginx-voice-marketingravan.conf \
#           /etc/nginx/sites-available/voice.marketingravan.com
#        ln -s /etc/nginx/sites-available/voice.marketingravan.com \
#              /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#   3. Certificate (the page is https, so the socket must be wss):
#        certbot --nginx -d voice.marketingravan.com
#      certbot rewrites this file in place to add the TLS lines.
#   4. Point the browser at it:
#        echo 'WEB_VOICE_WS_ORIGIN=wss://voice.marketingravan.com' \
#          >> /etc/marketingravan.env
#        systemctl restart marketingravan-api
#
# Until step 4 the browser keeps using the page's own origin, so every step
# before it is safe to do on a live site.

server {
    listen 80;
    listen [::]:80;
    server_name voice.marketingravan.com;

    # Nothing but the voice socket is served here. A stray request should not
    # find a copy of the site on an unproxied hostname.
    location = /api/voice/web {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Audio is small and latency-sensitive: buffering it to disk or waiting
        # to fill a buffer is exactly the wrong trade.
        proxy_buffering off;
        tcp_nodelay on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The config endpoint, so the browser can be told about this host from it.
    location = /api/voice/web/config {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
